[package]
name              = "fovea-examples"
description       = "End-to-end example programs for the fovea computer-vision crates"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme            = "README.md"
publish           = false

# NOTE: the dependencies below are *version*-based (against crates.io),
# not path-based, so that this repo's public CI compiles against a real
# release of the fovea crates — the integration smoke test that
# justifies a separate examples repo.
#
# For local development against in-progress code, the private workspace
# at `fovea-workspace/Cargo.toml` defines a `[patch.crates-io]` block
# that redirects these to the in-tree paths. That patch never reaches
# the public `fovea-examples` repo.
[dependencies]
fovea         = "0.1.1"
fovea-io      = { version = "0.1.1", features = ["all-codecs"] }
fovea-display = { version = "0.1.1", features = ["debug-window"] }
clap          = { version = "4", features = ["derive"] }

[[bin]]
name = "simple"
path = "src/simple.rs"

[[bin]]
name = "resize"
path = "src/resize.rs"

[[bin]]
name = "show_srgb"
path = "src/show_srgb.rs"

[[bin]]
name = "show_mono16"
path = "src/show_mono16.rs"

[[bin]]
name = "show_roi"
path = "src/show_roi.rs"

[[bin]]
name = "show_multi"
path = "src/show_multi.rs"

[[bin]]
name = "show_linear"
path = "src/show_linear.rs"

[[bin]]
name = "edge_overlay"
path = "src/edge_overlay.rs"

[[bin]]
name = "perona_malik"
path = "src/perona_malik.rs"

[[bin]]
name = "show_histogram"
path = "src/show_histogram.rs"

[[bin]]
name = "show_histogram_consumers"
path = "src/show_histogram_consumers.rs"

[[bin]]
name = "tile_flip_rotate"
path = "src/tile_flip_rotate.rs"
